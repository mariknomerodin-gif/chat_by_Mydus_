<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Стабильный чат (MQTT)</title>
  <style>
    body { margin:0; font-family:sans-serif; background:#f5f5f5; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
    #login { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; background:#fff; padding:20px; text-align:center; }
    input { padding:14px; border:1px solid #ccc; border-radius:8px; width:100%; max-width:360px; margin-bottom:12px; box-sizing:border-box; }
    button { padding:16px 24px; background:#007bff; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:16px; }
    
    #chat { display:none; flex-direction:column; height:100%; }
    #status { padding:10px 15px; background:#eef; border-bottom:1px solid #ddd; font-size:14px; color:#444; }
    #messages { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding:15px; }
    .msg { padding:12px 16px; border-radius:12px; max-width:80%; word-wrap:break-word; }
    .mine { align-self:flex-end; background:#007bff; color:#fff; }
    .other { align-self:flex-start; background:#e9ecef; color:#222; }
    
    #controls { display:flex; gap:12px; padding:12px; background:#fff; border-top:1px solid #ddd; align-items:center; justify-content:center; }
    #msg-input { flex:1; padding:12px; border:1px solid #ccc; border-radius:24px; outline:none; box-sizing:border-box; }
    #record-btn { width:64px; height:64px; border-radius:50%; background:#dc3545; color:white; border:none; cursor:pointer; font-size:24px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 6px rgba(0,0,0,0.2); }
    #record-btn.recording { background:#ffc107; color:#222; transform:scale(1.1); }
  </style>
</head>
<body>
  <div id="login">
    <h2>Вход в чат</h2>
    <input id="name" placeholder="Твое имя" />
    <input id="room" placeholder="Название комнаты" />
    <button id="start">Войти</button>
  </div>

  <div id="chat">
    <div id="status">Ожидание...</div>
    <div id="messages"></div>
    <div id="controls">
      <button id="record-btn" title="Голос (макс 4 сек)">🎤</button>
      <input id="msg-input" placeholder="Текст..." />
      <button id="send">➤</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>
  <script>
    const login = document.getElementById('login');
    const chat = document.getElementById('chat');
    const nameInp = document.getElementById('name');
    const roomInp = document.getElementById('room');
    const startBtn = document.getElementById('start');
    const msgInp = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send');
    const recordBtn = document.getElementById('record-btn');
    const msgs = document.getElementById('messages');
    const status = document.getElementById('status');

    let client, topic, userName;
    const myId = Math.random().toString(36).slice(2, 10);
    const seen = new Set();

    startBtn.onclick = () => {
      userName = nameInp.value.trim() || 'Гость';
      const room = roomInp.value.trim();
      if (!room) return alert('Введи название комнаты');
      topic = 'chat/' + room;

      login.style.display = 'none';
      chat.style.display = 'flex';
      status.textContent = 'Подключаюсь...';

      client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
        clientId: 'web_' + myId + '_' + Date.now(),
        clean: true, connectTimeout: 8000, reconnectPeriod: 2000
      });

      client.on('connect', () => {
        status.textContent = '✅ Подключено: ' + room;
        client.subscribe(topic, { qos: 0 });
      });
      client.on('close', () => status.textContent = '⚠️ Соединение закрыто');
      client.on('error', (e) => status.textContent = '⚠️ Ошибка: ' + e.message);

      client.on('message', (t, payload) => {
        let d;
        try { d = JSON.parse(payload.toString()); } catch (e) { return; }
        if (d.senderId === myId) return;
        if (d.id && seen.has(d.id)) return;
        if (d.id) seen.add(d.id);
        if (d.type === 'voice') addVoice(d.user, d.audio, false);
        else addMessage(d.user, d.text, false);
      });
    };

    sendBtn.onclick = sendMsg;
    msgInp.onkeydown = e => { if (e.key === 'Enter') sendMsg(); };

    function sendMsg() {
      const txt = msgInp.value.trim();
      if (!txt || !client || !client.connected) return;
      client.publish(topic, JSON.stringify({
        id: Date.now().toString(36) + myId,
        senderId: myId, user: userName, text: txt
      }));
      addMessage(userName, txt, true);
      msgInp.value = ''; msgInp.focus();
    }

    function addMessage(name, text, isMine) {
      const div = document.createElement('div');
      div.className = 'msg ' + (isMine ? 'mine' : 'other');
      if (isMine) div.textContent = text;
      else div.innerHTML = '<b>' + name + '</b><br>' + text;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function addVoice(name, dataUrl, isMine) {
      const div = document.createElement('div');
      div.className = 'msg ' + (isMine ? 'mine' : 'other');
      if (!isMine) div.innerHTML = '<b>' + name + '</b><br>';
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.src = dataUrl;
      div.appendChild(audio);
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    // ЗАПИСЬ: жёсткий лимит 4 секунды и проверка размера
    let mediaRecorder = null, chunks = [], recording = false, timer = null;

    recordBtn.onclick = () => recording ? stopRec() : startRec();

    async function startRec() {
      if (!client || !client.connected) return alert('Дождись статуса «Подключено»');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = [];
        const mimeList = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg;codecs=opus'];
        let mime = '';
        for (const m of mimeList) if (MediaRecorder.isTypeSupported(m)) { mime = m; break; }

        mediaRecorder = mime
          ? new MediaRecorder(stream, { mimeType: mime, audioBitsPerSecond: 16000 })
          : new MediaRecorder(stream, { audioBitsPerSecond: 16000 });

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

        mediaRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          if (blob.size === 0) { status.textContent = '⚠️ Пустая запись'; return; }

          const reader = new FileReader();
          reader.onloadend = () => {
            const dataUrl = reader.result;
            // Лимит: не больше 180 КБ. Это примерно 4–5 секунд — точно пролезет.
            if (dataUrl.length > 180000) {
              status.textContent = '⚠️ Слишком длинное (лимит 4 сек). Запиши короче.';
              return;
            }
            addVoice(userName, dataUrl, true);
            status.textContent = '🎙️ Отправляю...';
            client.publish(topic, JSON.stringify({
              id: Date.now().toString(36) + myId,
              senderId: myId, type: 'voice', user: userName, audio: dataUrl
            }), (err) => {
              status.textContent = err ? '❌ Не ушло: ' + err.message : '✅ Голосовое отправлено';
            });
          };
          reader.readAsDataURL(blob);
        };

        mediaRecorder.start();
        recording = true;
        recordBtn.classList.add('recording');
        recordBtn.textContent = '⏹';
        // Автостоп через 4 секунды
        timer = setTimeout(() => { if (recording) stopRec(); }, 4000);
      } catch (e) {
        status.textContent = '⚠️ Микрофон не включился: ' + e.message;
        alert('Ошибка микрофона: ' + e.message);
      }
    }

    function stopRec() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      recording = false;
      clearTimeout(timer);
      recordBtn.classList.remove('recording');
      recordBtn.textContent = '🎤';
    }
  </script>
</body>
</html>
